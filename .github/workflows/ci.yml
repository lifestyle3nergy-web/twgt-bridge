name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check every source file
        run: |
          for f in $(find lib bin tests -name '*.mjs'); do
            node --check "$f"
          done
      - name: Run fail-closed tests
        run: node --test tests/
