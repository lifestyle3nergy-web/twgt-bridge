name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check every source file
        run: |
          for f in $(find lib bin tests -name '*.mjs'); do
            node --check "$f"
          done
      - name: Checkout twgt-schema-gate for contract test
        uses: actions/checkout@v4
        with:
          repository: lifestyle3nergy-web/twgt-schema-gate
          ref: main
          path: .twgt-schema-gate

      - name: Run fail-closed tests
        env:
          TWGT_SCHEMA_GATE_PATH: ${{ github.workspace }}/.twgt-schema-gate
        run: |
          set -euo pipefail
          shopt -s globstar
          node --test tests/**/*.test.mjs
