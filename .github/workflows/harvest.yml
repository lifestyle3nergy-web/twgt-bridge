name: harvest

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    name: harvest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect read-only evidence
        env:
          GITHUB_TOKEN: ${{ secrets.READ_TOKEN }}
        run: |
          node bin/collect.mjs lifestyle3nergy-web/twgt-schema-gate evidence

      - name: Verify pinned registry (fail-closed)
        env:
          GITHUB_TOKEN: ${{ secrets.READ_TOKEN }}
        run: node bin/verify-all.mjs pins

      - name: Upload evidence as reviewable artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 90
